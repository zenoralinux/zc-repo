name: Force Cancel All Active Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: force-cancel-all-active-runs
  cancel-in-progress: true

jobs:
  force-cancel-active-runs:
    name: Force cancel every other queued or running workflow
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel all active workflow runs in this repository
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;

            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const activeRuns = allRuns.filter(run =>
              ["queued", "in_progress", "waiting", "pending", "requested"].includes(run.status) &&
              run.id !== currentRunId
            );

            core.info(`Found ${activeRuns.length} other active workflow runs.`);

            let requested = 0;
            let failed = 0;

            for (const run of activeRuns) {
              let done = false;

              for (let attempt = 1; attempt <= 4 && !done; attempt++) {
                try {
                  await github.request(
                    "POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel",
                    { owner, repo, run_id: run.id }
                  );
                  requested++;
                  done = true;
                  core.info(`Force-cancel accepted: #${run.run_number} (ID ${run.id}) — ${run.name}`);
                } catch (error) {
                  if (error.status === 409) {
                    done = true;
                    core.warning(`Run ID ${run.id} is already transitioning or no longer cancellable.`);
                  } else if ((error.status >= 500 || !error.status) && attempt < 4) {
                    core.warning(`Temporary error for run ID ${run.id}; retry ${attempt}/3: ${error.message}`);
                    await new Promise(resolve => setTimeout(resolve, attempt * 3000));
                  } else {
                    failed++;
                    core.warning(`Could not force-cancel run ID ${run.id}: ${error.message}`);
                    done = true;
                  }
                }
              }
            }

            core.info(`Force-cancel requests accepted: ${requested}`);
            core.info(`Force-cancel requests failed: ${failed}`);

            if (failed > 0) {
              core.setFailed(`${failed} force-cancel request(s) failed. Check permissions and logs.`);
            }
