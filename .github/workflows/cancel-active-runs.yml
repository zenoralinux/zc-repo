name: Cancel All Active Workflow Runs

on:
  # Updating this workflow file starts the cleanup automatically.
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-active-runs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-all-active-runs
  cancel-in-progress: true

jobs:
  cancel-active-runs:
    name: Cancel every other queued or running workflow
    runs-on: ubuntu-latest
    steps:
      - name: Cancel all active workflow runs in this repository
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;

            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const activeRuns = allRuns.filter(run =>
              ["queued", "in_progress", "waiting", "pending", "requested"].includes(run.status) &&
              run.id !== currentRunId
            );

            core.info(`Found ${activeRuns.length} other active workflow runs.`);

            let requested = 0;
            let failed = 0;

            for (const run of activeRuns) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                requested++;
                core.info(`Cancellation requested: #${run.run_number} (ID ${run.id}) — ${run.name}`);
              } catch (error) {
                failed++;
                core.warning(`Could not cancel run ID ${run.id}: ${error.message}`);
              }
            }

            core.info(`Cancellation requests accepted: ${requested}`);
            core.info(`Cancellation requests failed: ${failed}`);

            if (failed > 0) {
              core.setFailed(`${failed} cancellation request(s) failed. Check permissions and logs.`);
            }
